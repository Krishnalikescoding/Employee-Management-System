# Render Blueprint — https://render.com/docs/blueprint-spec
# Existing services do NOT pick this up until you change Start Command in the dashboard
# or recreate the service from this blueprint.

services:
  - type: web
    name: manthan-infotech-workforce
    runtime: node
    rootDir: backend
    buildCommand: npm install
    # Use npm start — NOT "node backend/index.js" (that doubles the backend path)
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
